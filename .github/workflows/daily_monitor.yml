name: Daily TAG Notice Monitor

on:
  schedule:
    # 每天北京时间09:00 (UTC 01:00) 运行
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run monitor
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          FIRST_RUN_NOTIFY: ${{ secrets.FIRST_RUN_NOTIFY }}
          TAG_TOKEN: ${{ secrets.TAG_TOKEN }}
          TAG_EMAIL: ${{ secrets.TAG_EMAIL }}
          TAG_PASSWORD: ${{ secrets.TAG_PASSWORD }}
          TAG_API_BASE: ${{ secrets.TAG_API_BASE }}
        run: node src/monitor.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/notices.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update notices [skip ci]" && git push)
